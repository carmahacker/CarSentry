name: CarSentry
version: "1.0.0"
slug: carsentry
description: ANPR CarSentry — recognition of license plates from RTSP cameras (entry + parking presence modes)
url: https://github.com/your-repo/carsentry
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ports:
  8000/tcp: 8010
ports_description:
  8000/tcp: CarSentry API & UI
map:
  - type: data
    read_only: false
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
image: ghcr.io/your-org/carsentry-{arch}
ingress: true
ingress_port: 8000
panel_icon: mdi:car-license-plate
panel_title: CarSentry
homeassistant_api: true
hassio_api: true
auth_api: true
host_network: false
privileged: []
devices: []
environment:
  TZ: Europe/Moscow
  ANPR_YOLO_MODEL: /models/anpr/yolo/best.pt
  ANPR_OCR_MODEL: /models/anpr/ocr/crnn_ocr_model_int8_fx.pth
  ANPR_OCR_DEVICE: cpu
